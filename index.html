<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CurateSearch</title>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-color: #ffffff;
      --text-color: #202124;
      --border-color: #000000;
      --card-bg: #f8f9fa;
    }

    body.dark-mode {
      --bg-color: #202124;
      --text-color: #e8eaed;
      --border-color: #ffffff;
      --card-bg: #303134;
    }

    body {
      font-family: 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif;
      background-color: var(--bg-color);
      color: var(--text-color);
      margin: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
      overflow-y: auto;
      transition: none; 
    }

    .top-bar-controls {
      position: absolute;
      top: 16px;
      left: 16px;
      right: 16px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      z-index: 100;
      box-sizing: border-box;
    }

    .subscribe-btn {
      background-color: #1a73e8;
      color: white;
      border: none;
      padding: 6px 14px;
      border-radius: 20px;
      font-family: inherit;
      font-size: clamp(12px, 2vw, 14px);
      font-weight: 600;
      cursor: pointer;
      text-decoration: none;
    }

    .subscribe-btn:hover { background-color: #1557b0; }

    .theme-switch-wrapper {
      display: flex;
      align-items: center;
    }

    .switch {
      position: relative;
      display: inline-block;
      width: 40px;
      height: 22px;
    }

    .switch input { opacity: 0; width: 0; height: 0; }

    .slider {
      position: absolute;
      cursor: pointer;
      top: 0; left: 0; right: 0; bottom: 0;
      background-color: #ccc;
      transition: 0.1s;
      border-radius: 22px;
    }

    .slider:before {
      position: absolute;
      content: "";
      height: 16px; width: 16px;
      left: 3px; bottom: 3px;
      background-color: white;
      transition: 0.1s;
      border-radius: 50%;
    }

    input:checked + .slider { background-color: #1a73e8; }
    input:checked + .slider:before { transform: translateX(18px); }

    .main-wrapper {
      display: flex;
      flex-direction: column;
      align-items: center;
      width: 100%;
      max-width: 1000px;
      padding: 60px 16px 30px 16px;
      box-sizing: border-box;
    }

    .search-container {
      width: 100%;
      max-width: 650px;
      display: flex;
      flex-direction: column;
      align-items: center;
      position: sticky;
      top: 0;
      background-color: var(--bg-color);
      padding: 15px 0;
      z-index: 50;
    }

    .logo {
      font-size: clamp(32px, 6vw, 48px);
      font-weight: 600;
      margin-bottom: 15px;
      letter-spacing: -1px;
    }

    .search-bar-form {
      width: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .search-input-wrapper {
      width: 100%;
      display: flex;
      align-items: center;
      border: 2.5px solid var(--border-color);
      border-radius: 30px;
      padding: 0 8px 0 16px;
      height: clamp(44px, 7vw, 56px);
      box-sizing: border-box;
      background-color: var(--bg-color);
    }

    .search-icon {
      width: 18px; height: 18px;
      margin-right: 10px;
      fill: none;
      stroke: var(--text-color);
      stroke-width: 2.5;
      stroke-linecap: round;
      stroke-linejoin: round;
      flex-shrink: 0;
    }

    .search-input {
      flex: 1;
      border: none;
      outline: none;
      background: transparent;
      font-family: inherit;
      font-size: clamp(14px, 2vw, 16px);
      color: var(--text-color);
      min-width: 0;
    }

    .go-btn {
      background-color: #1a73e8;
      color: white;
      border: none;
      padding: 8px 16px;
      border-radius: 20px;
      font-family: inherit;
      font-size: clamp(13px, 1.8vw, 15px);
      font-weight: 600;
      cursor: pointer;
      flex-shrink: 0;
      margin-left: 6px;
    }

    .go-btn:hover { background-color: #1557b0; }

    /* Results Content Section */
    .content-section {
      width: 100%;
      margin-top: 25px;
    }

    .carousel-container {
      display: flex;
      gap: 16px;
      overflow-x: auto;
      padding-bottom: 15px;
      width: 100%;
      box-sizing: border-box;
      scroll-snap-type: x mandatory;
    }

    .carousel-container::-webkit-scrollbar { height: 5px; }
    .carousel-container::-webkit-scrollbar-thumb { background: rgba(128,128,128,0.4); border-radius: 10px; }

    .carousel-card {
      min-width: 240px;
      max-width: 280px;
      flex: 0 0 75%;
      height: 230px;
      background-color: var(--card-bg);
      border: 2px solid var(--border-color);
      border-radius: 16px;
      scroll-snap-align: start;
      cursor: pointer;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      box-sizing: border-box;
      transition: transform 0.2s;
    }

    @media (min-width: 768px) {
      .carousel-card {
        flex: 0 0 calc(33.333% - 11px);
        min-width: unset;
        max-width: unset;
      }
    }

    .carousel-card:hover { transform: translateY(-3px); }

    .card-img-container {
      width: 100%;
      height: 115px;
      background: #ddd;
      overflow: hidden;
    }

    .card-img-container img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .card-content {
      padding: 10px 12px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      flex: 1;
    }

    .carousel-card h3 { margin: 0 0 4px 0; font-size: 14px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .carousel-card p { margin: 0; font-size: 11px; opacity: 0.8; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }

    /* Comparison Section & Table */
    .comparison-section {
      margin-top: 25px;
      background: var(--card-bg);
      border: 2px solid var(--border-color);
      border-radius: 16px;
      padding: 16px;
      display: none;
      width: 100%;
      box-sizing: border-box;
    }

    .comparison-section.active { display: block; }

    .comparison-section h3 {
      font-size: clamp(16px, 2.5vw, 20px);
      margin-top: 0;
      margin-bottom: 12px;
    }

    .table-responsive {
      width: 100%;
      overflow-x: auto;
    }

    .comparison-table {
      width: 100%;
      border-collapse: collapse;
      text-align: left;
      min-width: 480px;
    }

    .comparison-table th, .comparison-table td {
      padding: 10px 8px;
      border-bottom: 1px solid rgba(128, 128, 128, 0.2);
      font-size: clamp(12px, 1.6vw, 14px);
    }

    .book-btn {
      background-color: #1a73e8;
      color: white;
      border: none;
      padding: 5px 10px;
      border-radius: 14px;
      cursor: pointer;
      font-weight: 600;
      font-size: clamp(11px, 1.5vw, 13px);
      text-decoration: none;
      display: inline-block;
      white-space: nowrap;
    }

    .book-btn:hover { background-color: #1557b0; }
  </style>
</head>
<body class="dark-mode">

  <div class="top-bar-controls">
    <button class="subscribe-btn" onclick="alert('Thank you for subscribing!')">Subscribe</button>
    <div class="theme-switch-wrapper">
      <label class="switch">
        <input type="checkbox" id="themeCheckbox" checked onchange="toggleTheme()">
        <span class="slider"></span>
      </label>
    </div>
  </div>

  <div class="main-wrapper">
    <div class="search-container">
      <div class="logo">CurateSearch</div>
      <form class="search-bar-form" id="searchForm" onsubmit="performSearch(event)">
        <div class="search-input-wrapper">
          <svg class="search-icon" viewBox="0 0 24 24">
            <circle cx="11" cy="11" r="8"></circle>
            <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
          </svg>
          <input type="text" id="searchInput" class="search-input" autofocus autocomplete="off" placeholder="Search anything...">
          <button type="submit" class="go-btn">Go</button>
        </div>
      </form>
    </div>

    <div class="content-section">
      <div class="carousel-container" id="carouselContainer">
        <!-- Dynamic Carousel Cards Will Load Here -->
      </div>

      <div class="comparison-section" id="comparisonSection">
        <h3 id="comparisonTitle">Option Comparison</h3>
        <div class="table-responsive">
          <table class="comparison-table">
            <thead>
              <tr>
                <th style="width: 30%;">Provider / Model</th>
                <th style="width: 22%;">Price / Value</th>
                <th style="width: 28%;">Key Feature</th>
                <th style="width: 20%;">Action</th>
              </tr>
            </thead>
            <tbody id="comparisonTableBody">
              <!-- Dynamic Comparison Rows Will Load Here -->
            </tbody>
          </table>
        </div>
      </div>
    </div>
  </div>

  <script>
    function toggleTheme() {
      document.body.classList.toggle('dark-mode');
    }

    async function performSearch(event) {
      event.preventDefault();
      const query = document.getElementById('searchInput').value.trim();
      if (!query) return;

      const carousel = document.getElementById('carouselContainer');
      carousel.innerHTML = '<p style="padding:20px;">Searching web results...</p>';

      try {
        const response = await fetch(`https://api.allorigins.win/raw?url=` + encodeURIComponent(`https://html.duckduckgo.com/html/?q=${encodeURIComponent(query)}`));
        if (!response.ok) throw new Error('Network response failed');
        const htmlText = await response.text();
        
        const parser = new DOMParser();
        const doc = parser.parseFromString(htmlText, 'text/html');
        const results = [];
        
        doc.querySelectorAll('.result').forEach(el => {
          const titleEl = el.querySelector('.result__title');
          const snippetEl = el.querySelector('.result__snippet');
          if (titleEl) {
            results.push({
              title: titleEl.innerText.trim(),
              content: snippetEl ? snippetEl.innerText.trim() : 'Click to compare specs and pricing'
            });
          }
        });

        if (results.length > 0) {
          renderCarousel(results, query);
        } else {
          renderFallbackCarousel(query);
        }
      } catch (error) {
        renderFallbackCarousel(query);
      }
    }

    function getCardImage(title, query) {
      const text = (title + " " + query).toLowerCase();
      
      if (text.includes('laptop') || text.includes('macbook') || text.includes('computer')) {
        return 'https://images.unsplash.com/photo-1517336714731-489689fd1ca8?auto=format&fit=crop&w=300&q=80';
      } else if (text.includes('car') || text.includes('vehicle') || text.includes('electric') || text.includes('tesla') || text.includes('dubai')) {
        return 'https://images.unsplash.com/photo-1503376780353-7e6692767b70?auto=format&fit=crop&w=300&q=80';
      } else if (text.includes('phone') || text.includes('smartphone') || text.includes('iphone') || text.includes('samsung')) {
        return 'https://images.unsplash.com/photo-1511707171634-5f897ff02aa9?auto=format&fit=crop&w=300&q=80';
      } else if (text.includes('hotel') || text.includes('resort') || text.includes('travel')) {
        return 'https://images.unsplash.com/photo-1566073771259-6a8506099945?auto=format&fit=crop&w=300&q=80';
      } else if (text.includes('food') || text.includes('restaurant') || text.includes('cafe')) {
        return 'https://images.unsplash.com/photo-1517248135467-4c7edcad34c4?auto=format&fit=crop&w=300&q=80';
      } else if (text.includes('crypto') || text.includes('bitcoin') || text.includes('finance') || text.includes('stock')) {
        return 'https://images.unsplash.com/photo-1611974789855-9c2a0a7236a3?auto=format&fit=crop&w=300&q=80';
      }
      
      return 'https://images.unsplash.com/photo-1460925895917-afdab827c52f?auto=format&fit=crop&w=300&q=80';
    }

    function renderCarousel(results, query) {
      const carousel = document.getElementById('carouselContainer');
      carousel.innerHTML = '';

      results.slice(0, 6).forEach((item) => {
        const card = document.createElement('div');
        card.className = 'carousel-card';
        const imgSrc = getCardImage(item.title, query);
        
        card.innerHTML = `
          <div class="card-img-container">
            <img src="${imgSrc}" alt="${item.title}">
          </div>
          <div class="card-content">
            <h3>${item.title}</h3>
            <p>${item.content}</p>
          </div>
        `;
        card.onclick = () => showComparison(item, query);
        carousel.appendChild(card);
      });
    }

    function renderFallbackCarousel(query) {
      const carousel = document.getElementById('carouselContainer');
      carousel.innerHTML = '';
      
      const mockItems = [
        { title: query + " - Premium Edition", content: "Top-rated model featuring high performance and reliability." },
        { title: query + " - Standard Choice", content: "Cost-effective option with standard industry features." },
        { title: "Alternative " + query, content: "Highly recommended alternative choice from top vendors." }
      ];

      mockItems.forEach((item) => {
        const card = document.createElement('div');
        card.className = 'carousel-card';
        const imgSrc = getCardImage(item.title, query);

        card.innerHTML = `
          <div class="card-img-container">
            <img src="${imgSrc}" alt="${item.title}">
          </div>
          <div class="card-content">
            <h3>${item.title}</h3>
            <p>${item.content}</p>
          </div>
        `;
        card.onclick = () => showComparison(item, query);
        carousel.appendChild(card);
      });
    }

    function showComparison(item, query) {
      const section = document.getElementById('comparisonSection');
      const title = document.getElementById('comparisonTitle');
      const tbody = document.getElementById('comparisonTableBody');

      title.innerText = `Comparing: ${item.title}`;
      section.classList.add('active');

      tbody.innerHTML = `
        <tr>
          <td><strong>Vendor Alpha</strong></td>
          <td>$999.00</td>
          <td>In Stock / Fast Ship</td>
          <td><a href="https://example.com" target="_blank" class="book-btn">View Deal</a></td>
        </tr>
        <tr>
          <td><strong>Global Distributor</strong></td>
          <td>$950.00</td>
          <td>Standard Delivery</td>
          <td><a href="https://example.com" target="_blank" class="book-btn">View Deal</a></td>
        </tr>
        <tr>
          <td><strong>Direct Retailer</strong></td>
          <td>$975.00</td>
          <td>Extended Warranty</td>
          <td><a href="https://example.com" target="_blank" class="book-btn">View Deal</a></td>
        </tr>
      `;
      section.scrollIntoView({ behavior: 'smooth' });
    }
  </script>
</body>
</html>
