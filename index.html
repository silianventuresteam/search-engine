<!DOCTYPE html>
<html lang="en">
<head>

  <title>Search</title>

    :root {
      --bg-color: #ffffff;
      --text-color: #202124;
      --border-color: #000000;
    }

      --text-color: #e8eaed;
      --border-color: #ffffff;
    }

      background-color: var(--bg-color);
      color: var(--text-color);
      margin: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
      overflow-y: auto;
      transition: background-color 0.3s ease, color 0.3s ease;
    }

    .theme-switch-container {

      right: 20px;

      align-items: center;
      z-index: 100;
    }

      display: inline-block;
      width: 44px;
      height: 24px;
    }

    .switch input {
      opacity: 0;
      width: 0;
      height: 0;
    }

      cursor: pointer;

      background-color: #ccc;
      transition: 0.3s;
      border-radius: 24px;
    }
