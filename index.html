<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Search</title>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-color: #ffffff;
      --text-color: #202124;
      --border-color: #000000;
    }

    body.dark-mode {
      --bg-color: #202124;
      --text-color: #e8eaed;
      --border-color: #ffffff;
    }

    body {
      font-family: 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif;
      background-color: var(--bg-color);
      color: var(--text-color);
      margin: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
      overflow-y: auto;
      transition: background-color 0.3s ease, color 0.3s ease;
    }

    .theme-switch-container {
      position: absolute;
      top: 20px;
      right: 20px;
      display: flex;
      align-items: center;
      z-index: 100;
    }

    .switch {
      position: relative;
      display: inline-block;
      width: 44px;
      height: 24px;
    }

    .switch input {
      opacity: 0;
      width: 0;
      height: 0;
    }

    .slider {
      position: absolute;
      cursor: pointer;
      top: 0; left: 0; right: 0; bottom: 0;
      background-color: #ccc;
      transition: 0.3s;
      border-radius: 24px;
    }

    .slider:before {
      position: absolute;
      content: "";
      height: 18px;
      width: 18px;
      left: 3px;
      bottom: 3px;
      background-color: white;
      transition: 0.3s;
      border-radius: 50%;
    }

    input:checked + .slider {
      background-color: #1a73e8;
    }

    input:checked + .slider:before {
      transform: translateX(20px);
    }

    .main-wrapper {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-start;
      flex: 1;
      width: 100%;
      padding: 40px 20px;
      box-sizing: border-box;
    }

    .search-container {
      width: 100%;
      max-width: 584px;
      padding: 0 20px;
      box-sizing: border-box;
      display: flex;
      flex-direction: column;
      align-items: center;
      position: sticky;
      top: 0;
      background-color: var(--bg-color);
      padding-top: 30px;
      padding-bottom: 30px;
      z-index: 50;
      transition: background-color 0.3s ease;
    }

    .logo {
      font-size: 48px;
      font-weight: 600;
      margin-bottom: 30px;
      letter-spacing: -1px;
    }

    .category-menu {
      display: flex;
      gap: 10px;
      justify-content: center;
      margin-top: 24px;
      flex-wrap: wrap;
    }

    .pill-btn {
      background-color: transparent;
      border: 1px solid rgba(128, 128, 128, 0.3);
      color: var(--text-color);
      padding: 8px 16px;
      border-radius: 50px;
      font-family: 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif;
      font-size: 14px;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    body.dark-mode .pill-btn {
      border-color: rgba(255, 255, 255, 0.2);
    }

    .pill-btn:hover {
      background-color: rgba(128, 128, 128, 0.1);
    }
    
    body.dark-mode .pill-btn:hover {
      background-color: rgba(255, 255, 255, 0.1);
    }

    .content-section {
      width: 100%;
      max-width: 800px;
      padding: 20px;
      box-sizing: border-box;
      display: flex;
      flex-direction: column;
      gap: 20px;
    }

    /* --- Google Search Element Overrides for Plus Jakarta Sans --- */
    .gsc-control-cse {
      background-color: transparent !important;
      border: none !important;
      font-family: 'Plus Jakarta Sans', sans-serif !important;
      padding: 0 !important;
      width: 100% !important;
    }
    input.gsc-input, .gsc-input-box {
      background-color: var(--bg-color) !important;
      color: var(--text-color) !important;
      font-family: 'Plus Jakarta Sans', sans-serif !important;
      border: 3px solid var(--border-color) !important;
      border-radius: 28px !important;
      padding: 0 18px !important;
      height: 48px !important;
    }
    .gsc-search-button-v2 {
      display: none !important; /* Hide default ugly button since we match your style */
    }
    .gsc-resultsRoot, .gs-title, .gs-snippet {
      font-family: 'Plus Jakarta Sans', sans-serif !important;
      color: var(--text-color) !important;
    }
    body.dark-mode .gs-title *, body.dark-mode .gs-snippet * {
      color: var(--text-color) !important;
    }
  </style>
</head>
<body class="dark-mode">

  <div class="theme-switch-container">
    <label class="switch">
      <input type="checkbox" id="themeCheckbox" checked onchange="toggleTheme()">
      <span class="slider"></span>
    </label>
  </div>

  <div class="main-wrapper" id="mainWrapper">
    <div class="search-container" id="searchContainer">
      <div class="logo">
        Search
      </div>

      <!-- Google Custom Search Integration Script -->
      <script async src="https://cse.google.com/cse.js?cx=d2e501877c4674cd6"></script>
      <!-- Split Layout: Search box goes here -->
      <div class="gcse-searchbox" data-resultsUrl="" data-newWindow="false"></div>

      <div class="category-menu">
        <button type="button" class="pill-btn" onclick="submitCategory('flights')">Flights</button>
        <button type="button" class="pill-btn" onclick="submitCategory('hotels and resorts')">Hotels & Resorts</button>
        <button type="button" class="pill-btn" onclick="submitCategory('restaurants')">Restaurants</button>
        <button type="button" class="pill-btn" onclick="submitCategory('maps')">Maps</button>
      </div>
    </div>

    <div class="content-section">
      <!-- Split Layout: Search results load here -->
      <div class="gcse-searchresults"></div>
    </div>
  </div>

  <script>
    function toggleTheme() {
      const body = document.body;
      const checkbox = document.getElementById('themeCheckbox');
      if (checkbox.checked) {
        body.classList.add('dark-mode');
      } else {
        body.classList.remove('dark-mode');
      }
    }

    function submitCategory(category) {
      const input = document.querySelector('input.gsc-input');
      if (input) {
        input.value = category;
        const event = new Event('keyup');
        input.dispatchEvent(event);
        // Trigger search form submit programmatically
        const form = input.closest('form');
        if (form) form.submit();
      }
    }
  </script>

</body>
</html>
