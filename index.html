<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CurateSearch</title>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-color: #ffffff;
      --text-color: #202124;
      --border-color: #000000;
      --card-bg: #f8f9fa;
    }

    body.dark-mode {
      --bg-color: #202124;
      --text-color: #e8eaed;
      --border-color: #ffffff;
      --card-bg: #303134;
    }

    body {
      font-family: 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif;
      background-color: var(--bg-color);
      color: var(--text-color);
      margin: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
      overflow-y: auto;
      transition: none; 
    }

    .top-bar-controls {
      position: absolute;
      top: 16px;
      left: 16px;
      right: 16px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      z-index: 100;
      box-sizing: border-box;
    }

    .subscribe-btn {
      background-color: #1a73e8;
      color: white;
      border: none;
      padding: 6px 14px;
      border-radius: 20px;
      font-family: inherit;
      font-size: clamp(12px, 2vw, 14px);
      font-weight: 600;
      cursor: pointer;
      text-decoration: none;
    }

    .subscribe-btn:hover { background-color: #1557b0; }

    .theme-switch-wrapper {
      display: flex;
      align-items: center;
    }

    .switch {
      position: relative;
      display: inline-block;
      width: 40px;
      height: 22px;
    }

    .switch input { opacity: 0; width: 0; height: 0; }

    .slider {
      position: absolute;
      cursor: pointer;
      top: 0; left: 0; right: 0; bottom: 0;
      background-color: #ccc;
      transition: 0.1s;
      border-radius: 22px;
    }

    .slider:before {
      position: absolute;
      content: "";
      height: 16px; width: 16px;
      left: 3px; bottom: 3px;
      background-color: white;
      transition: 0.1s;
      border-radius: 50%;
    }

    input:checked + .slider { background-color: #1a73e8; }
    input:checked + .slider:before { transform: translateX(18px); }

    .main-wrapper {
      display: flex;
      flex-direction: column;
      align-items: center;
      width: 100%;
      max-width: 1000px;
      padding: 60px 16px 30px 16px;
      box-sizing: border-box;
    }

    .search-container {
      width: 100%;
      max-width: 650px;
      display: flex;
      flex-direction: column;
      align-items: center;
      position: sticky;
      top: 0;
      background-color: var(--bg-color);
      padding: 15px 0;
      z-index: 50;
    }

    .logo {
      font-size: clamp(32px, 6vw, 48px);
      font-weight: 600;
      margin-bottom: 15px;
      letter-spacing: -1px;
    }

    .search-bar-form {
      width: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .search-input-wrapper {
      width: 100%;
      display: flex;
      align-items: center;
      border: 2.5px solid var(--border-color);
      border-radius: 30px;
      padding: 0 8px 0 16px;
      height: clamp(44px, 7vw, 56px);
      box-sizing: border-box;
      background-color: var(--bg-color);
    }

    .search-icon {
      width: 18px; height: 18px;
      margin-right: 10px;
      fill: none;
      stroke: var(--text-color);
      stroke-width: 2.5;
      stroke-linecap: round;
      stroke-linejoin: round;
      flex-shrink: 0;
    }

    .search-input {
      flex: 1;
      border: none;
      outline: none;
      background: transparent;
      font-family: inherit;
      font-size: clamp(14px, 2vw, 16px);
      color: var(--text-color);
      min-width: 0;
    }

    .go-btn {
      background-color: #1a73e8;
      color: white;
      border: none;
      padding: 8px 16px;
      border-radius: 20px;
      font-family: inherit;
      font-size: clamp(13px, 1.8vw, 15px);
      font-weight: 600;
      cursor: pointer;
      flex-shrink: 0;
      margin-left: 6px;
    }

    .go-btn:hover { background-color: #1557b0; }

    /* Results Content Section */
    .content-section {
      width: 100%;
      margin-top: 25px;
    }

    .carousel-container {
      display: flex;
      gap: 16px;
      overflow-x: auto;
      padding-bottom: 15px;
      width: 100%;
      box-sizing: border-box;
      scroll-snap-type: x mandatory;
    }

    .carousel-container::-webkit-scrollbar { height: 5px; }
    .carousel-container::-webkit-scrollbar-thumb { background: rgba(128,128,128,0.4); border-radius: 10px; }

    .carousel-card {
      min-width: 240px;
      max-width: 280px;
      flex: 0 0 75%;
      height: 230px;
      background-color: var(--card-bg);
      border: 2px solid var(--border-color);
      border-radius: 16px;
      scroll-snap-align: start;
      cursor: pointer;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      box-sizing: border-box;
      transition: transform 0.2s;
    }

    @media (min-width: 768px) {
      .carousel-card {
        flex: 0 0 calc(33.333% - 11px);
        min-width: unset;
        max-width: unset;
      }
    }

    .carousel-card:hover { transform: translateY(-3px); }

    .card-img-container {
      width: 100%;
      height: 115px;
      background: #ddd;
      overflow: hidden;
    }

    .card-img-container img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .card-content {
      padding: 10px 12px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      flex: 1;
    }

    .carousel-card h3 { margin: 0 0 4px 0; font-size: 14px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .carousel-card p { margin: 0; font-size: 11px; opacity: 0.8; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }

    /* Comparison Section & Table */
    .comparison-section {
      margin-top: 25px;
      background: var(--card-bg);
      border: 2px solid var(--border-color);
      border-radius: 16px;
      padding: 16px;
      display: none;
      width: 100%;
      box-sizing: border-box;
    }

    .comparison-section.active { display: block; }

    .comparison-section h3 {
      font-size: clamp(16px, 2.5vw, 20px);
      margin-top: 0;
      margin-bottom: 12px;
    }

    .table-responsive {
      width: 100%;
      overflow-x: auto;
    }

    .comparison-table {
      width: 100%;
      border-collapse: collapse;
      text-align: left;
      min-width: 480px;
    }

    .comparison-table th, .comparison-table td {
      padding: 10px 8px;
      border-bottom: 1px solid rgba(128, 128, 128, 0.2);
      font-size: clamp(12px, 1.6vw, 14px);
    }

    .book-btn {
      background-color: #1a73e8;
      color: white;
      border: none;
      padding: 5px 10px;
      border-radius: 14px;
      cursor: pointer;
      font-weight: 600;
      font-size: clamp(11px, 1.5vw, 13px);
      text-decoration: none;
      display: inline-block;
      white-space: nowrap;
    }

    .book-btn:hover { background-color: #1557b0; }
  </style>
</head>
<body class="dark-mode">

  <div class="top-bar-controls">
    <button class="subscribe-btn" onclick="alert('Thank you for subscribing!')">Subscribe</button>
    <div class="theme-switch-wrapper">
      <label class="switch">
        <input type="checkbox" id="themeCheckbox" checked onchange="toggleTheme()">
        <span class="slider"></span>
      </label>
    </div>
  </div>

  <div class="main-wrapper">
    <div class="search-container">
      <div class="logo">CurateSearch</div>
      <form class="search-bar-form" id="searchForm" onsubmit="performSearch(event)">
        <div class="search-input-wrapper">
          <svg class="search-icon" viewBox="0 0 24 24">
            <circle cx="11" cy="11" r="8"></circle>
            <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
          </svg>
          <input type="text" id="searchInput" class="search-input" autofocus autocomplete="off" placeholder="Search anything...">
          <button type="submit" class="go-btn">Go</button>
        </div>
      </form>
    </div>

    <div class="content-section">
      <div class="carousel-container" id="carouselContainer">
        <!-- Dynamic Carousel Cards Will Load Here -->
      </div>

      <div class="comparison-section" id="comparisonSection">
        <h3 id="comparisonTitle">Option Comparison</h3>
        <div class="table-responsive">
          <table class="comparison-table">
            <thead>
              <tr id="tableHeaderRow">
                <!-- Dynamically updated headers -->
              </tr>
            </thead>
            <tbody id="comparisonTableBody">
              <!-- Dynamic Comparison Rows Will Load Here -->
            </tbody>
          </table>
        </div>
      </div>
    </div>
  </div>

  <script>
    function toggleTheme() {
      document.body.classList.toggle('dark-mode');
    }

    async function performSearch(event) {
      event.preventDefault();
      const query = document.getElementById('searchInput').value.trim();
      if (!query) return;

      const carousel = document.getElementById('carouselContainer');
      carousel.innerHTML = '<p style="padding:20px;">Searching web results...</p>';

      try {
        const response = await fetch(`https://api.duckduckgo.com/?q=${encodeURIComponent(query)}&format=json&no_html=1`);
        if (!response.ok) throw new Error('Network response failed');
        const data = await response.json();
        
        const results = [];
        
        if (data.Heading && data.AbstractText) {
          results.push({
            title: data.Heading,
            content: data.AbstractText,
            image: data.Image ? `https://duckduckgo.com${data.Image}` : null
          });
        }

        if (data.RelatedTopics && data.RelatedTopics.length > 0) {
          data.RelatedTopics.forEach(topic => {
            if (topic.Text && topic.FirstURL) {
              results.push({
                title: topic.Text.split(' - ')[0] || topic.Text,
                content: topic.Text,
                image: topic.Icon && topic.Icon.URL ? `https://duckduckgo.com${topic.Icon.URL}` : null
              });
            }
          });
        }

        if (results.length > 0) {
          await enrichImagesWithWikipedia(results);
          renderCarousel(results, query);
        } else {
          renderFallbackCarousel(query);
        }
      } catch (error) {
        renderFallbackCarousel(query);
      }
    }

    async function enrichImagesWithWikipedia(results) {
      for (let item of results) {
        try {
          const searchTerm = item.title.split(' - ')[0].trim();
          const wikiRes = await fetch(`https://en.wikipedia.org/w/api.php?action=query&titles=${encodeURIComponent(searchTerm)}&prop=pageimages&pithumbsize=500&format=json&origin=*`);
          const wikiData = await wikiRes.json();
          const pages = wikiData.query.pages;
          for (let pageId in pages) {
            if (pages[pageId].thumbnail && pages[pageId].thumbnail.source) {
              item.image = pages[pageId].thumbnail.source;
              break;
            }
          }
        } catch (e) {
          // Fall back to existing image logic if wiki fetch fails
        }
      }
    }

    function getCardImage(item, query) {
      if (item.image && item.image.length > 10) {
        return item.image;
      }
      const targetTerm = encodeURIComponent(item.title || query);
      return `https://images.unsplash.com/photo-1557683316-973673baf926?auto=format&fit=crop&w=500&q=80&sig=${targetTerm}`;
    }

    function renderCarousel(results, query) {
      const carousel = document.getElementById('carouselContainer');
      carousel.innerHTML = '';

      results.slice(0, 6).forEach((item) => {
        const card = document.createElement('div');
        card.className = 'carousel-card';
        const imgSrc = getCardImage(item, query);
        
        card.innerHTML = `
          <div class="card-img-container">
            <img src="${imgSrc}" alt="${item.title}" onerror="this.src='https://images.unsplash.com/photo-1460925895917-afdab827c52f?auto=format&fit=crop&w=500&q=80'">
          </div>
          <div class="card-content">
            <h3>${item.title}</h3>
            <p>${item.content}</p>
          </div>
        `;
        card.onclick = () => showComparison(item, query);
        carousel.appendChild(card);
      });
    }

    async function renderFallbackCarousel(query) {
      const carousel = document.getElementById('carouselContainer');
      carousel.innerHTML = '';
      
      const mockItems = [
        { title: query + " - Overview", content: "Explore key details, history, and background information regarding " + query + "." },
        { title: query + " - Core Options", content: "Comprehensive selection of services, features, and specs related to " + query + "." },
        { title: "Global Alternatives to " + query, content: "Top-rated comparative alternatives and trusted market options." }
      ];

      await enrichImagesWithWikipedia(mockItems);

      mockItems.forEach((item) => {
        const card = document.createElement('div');
        card.className = 'carousel-card';
        const imgSrc = getCardImage(item, query);

        card.innerHTML = `
          <div class="card-img-container">
            <img src="${imgSrc}" alt="${item.title}" onerror="this.src='https://images.unsplash.com/photo-1460925895917-afdab827c52f?auto=format&fit=crop&w=500&q=80'">
          </div>
          <div class="card-content">
            <h3>${item.title}</h3>
            <p>${item.content}</p>
          </div>
        `;
        card.onclick = () => showComparison(item, query);
        carousel.appendChild(card);
      });
    }

    const industrySchemas = {
      retail: {
        headers: ['Item / Product', 'Estimated Price', 'Availability / Store', 'Action'],
        actionText: 'View Store',
        rows: [
          { col1: 'Premium Choice Item', col2: 'Ksh 240.00', col3: 'In Stock / Local Branch' },
          { col1: 'Standard Alternative', col2: 'Ksh 130.00', col3: 'In Stock / Aisle 4' },
          { col1: 'Bulk Package Deal', col2: 'Ksh 550.00', col3: 'High Demand / Limited' }
        ]
      },
      aviation: {
        headers: ['Flight / Route', 'Scheduled Time', 'Gate / Status', 'Action'],
        actionText: 'Flight Info',
        rows: [
          { col1: 'KQ 602 (Nairobi)', col2: '06:00 AM', col3: 'Gate 3 / On Time' },
          { col1: 'ET 308 (Addis Ababa)', col2: '09:30 AM', col3: 'Gate 1 / Boarding' },
          { col1: 'QR 1341 (Doha)', col2: '01:15 PM', col3: 'Gate 4 / Scheduled' }
        ]
      },
      hospitality: {
        headers: ['Property / Room', 'Nightly Rate', 'Amenities', 'Action'],
        actionText: 'Book Room',
        rows: [
          { col1: 'Deluxe Suite', col2: '$240.00', col3: 'Ocean View / King Bed' },
          { col1: 'Standard Room', col2: '$130.00', col3: 'City View / Queen Bed' },
          { col1: 'Executive Penthouse', col2: '$550.00', col3: 'Private Pool / Lounge' }
        ]
      },
      realestate: {
        headers: ['Asset / Location', 'Valuation', 'Cap Rate / Yield', 'Action'],
        actionText: 'View Listing',
        rows: [
          { col1: 'Commercial Block A', col2: '$1,250,000', col3: '8.4% Yield' },
          { col1: 'Residential Villa', col2: '$450,000', col3: '6.2% Yield' },
          { col1: 'Mixed-Use Plot', col2: '$300,000', col3: 'High Growth' }
        ]
      },
      finance: {
        headers: ['Instrument', 'Price / NAV', '24h Change', 'Action'],
        actionText: 'Trade',
        rows: [
          { col1: 'S&P 500 ETF', col2: '$512.40', col3: '+1.25%' },
          { col1: 'Treasury Bond 10Y', col2: '$98.50', col3: '-0.15%' },
          { col1: 'Global Index Fund', col2: '$145.20', col3: '+0.84%' }
        ]
      },
      automotive: {
        headers: ['Model / Trim', 'MSRP / Price', 'Specs / Range', 'Action'],
        actionText: 'Configure',
        rows: [
          { col1: 'Performance EV', col2: '$78,500', col3: '380 mi / AWD' },
          { col1: 'Long Range Sedan', col2: '$52,000', col3: '420 mi / RWD' },
          { col1: 'Urban Compact', col2: '$34,000', col3: '250 mi / FWD' }
        ]
      },
      default: {
        headers: ['Provider / Model', 'Price / Value', 'Key Feature', 'Action'],
        actionText: 'View Deal',
        rows: [
          { col1: 'Vendor Alpha', col2: '$999.00', col3: 'In Stock / Fast Ship' },
          { col1: 'Global Distributor', col2: '$950.00', col3: 'Standard Delivery' },
          { col1: 'Direct Retailer', col2: '$975.00', col3: 'Extended Warranty' }
        ]
      }
    };

    function detectIndustry(text) {
      if (/naivas|carrefour|supermarket|bread|milk|grocery|store|market|shop|mall|retail/i.test(text)) return 'retail';
      if (/airport|flight|airline|aviation|route/i.test(text)) return 'aviation';
      if (/hotel|resort|room|stay|bnb|accommodation|prideinn/i.test(text)) return 'hospitality';
      if (/property|apartment|house|real estate|land|villa/i.test(text)) return 'realestate';
      if (/stock|crypto|bond|forex|fund|shares|etf|trading/i.test(text)) return 'finance';
      if (/car|vehicle|electric|tesla|sedan|suv|automotive/i.test(text)) return 'automotive';
      return 'default';
    }

    function showComparison(item, query) {
      const section = document.getElementById('comparisonSection');
      const title = document.getElementById('comparisonTitle');
      const headerRow = document.getElementById('tableHeaderRow');
      const tbody = document.getElementById('comparisonTableBody');

      title.innerText = `Smart Context: ${item.title}`;
      section.classList.add('active');

      const combinedText = (item.title + " " + item.content + " " + query).toLowerCase();
      const industryKey = detectIndustry(combinedText);
      const schema = industrySchemas[industryKey];

      headerRow.innerHTML = schema.headers.map(h => `<th style="width: 25%;">${h}</th>`).join('');

      tbody.innerHTML = schema.rows.map(row => `
        <tr>
          <td><strong>${row.col1}</strong></td>
          <td>${row.col2}</td>
          <td>${row.col3}</td>
          <td><a href="https://example.com" target="_blank" class="book-btn">${schema.actionText}</a></td>
        </tr>
      `).join('');

      section.scrollIntoView({ behavior: 'smooth' });
    }
  </script>
</body>
</html>
