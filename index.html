<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CurateSearch</title>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-color: #ffffff;
      --text-color: #202124;
      --border-color: #000000;
      --card-bg: #f8f9fa;
      --divider-color: rgba(128, 128, 128, 0.3);
    }

    body.dark-mode {
      --bg-color: #202124;
      --text-color: #e8eaed;
      --border-color: #ffffff;
      --card-bg: #303134;
      --divider-color: rgba(255, 255, 255, 0.2);
    }

    body {
      font-family: 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif;
      background-color: var(--bg-color);
      color: var(--text-color);
      margin: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
      overflow-y: auto;
      transition: none; 
    }

    .top-bar-controls {
      position: absolute;
      top: 16px;
      left: 16px;
      right: 16px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      z-index: 100;
      box-sizing: border-box;
    }

    .subscribe-btn {
      background-color: #1a73e8;
      color: white;
      border: none;
      padding: 6px 14px;
      border-radius: 20px;
      font-family: inherit;
      font-size: clamp(12px, 2vw, 14px);
      font-weight: 600;
      cursor: pointer;
      text-decoration: none;
    }

    .subscribe-btn:hover { background-color: #1557b0; }

    .theme-switch-wrapper {
      display: flex;
      align-items: center;
    }

    .switch {
      position: relative;
      display: inline-block;
      width: 40px;
      height: 22px;
    }

    .switch input { opacity: 0; width: 0; height: 0; }

    .slider {
      position: absolute;
      cursor: pointer;
      top: 0; left: 0; right: 0; bottom: 0;
      background-color: #ccc;
      transition: 0.1s;
      border-radius: 22px;
    }

    .slider:before {
      position: absolute;
      content: "";
      height: 16px; width: 16px;
      left: 3px; bottom: 3px;
      background-color: white;
      transition: 0.1s;
      border-radius: 50%;
    }

    input:checked + .slider { background-color: #1a73e8; }
    input:checked + .slider:before { transform: translateX(18px); }

    .main-wrapper {
      display: flex;
      flex-direction: column;
      align-items: center;
      width: 100%;
      max-width: 1000px;
      padding: 60px 16px 30px 16px;
      box-sizing: border-box;
    }

    .search-container {
      width: 100%;
      max-width: 650px;
      display: flex;
      flex-direction: column;
      align-items: center;
      position: sticky;
      top: 0;
      background-color: var(--bg-color);
      padding: 15px 0;
      z-index: 50;
    }

    .logo {
      font-size: clamp(32px, 6vw, 48px);
      font-weight: 600;
      margin-bottom: 15px;
      letter-spacing: -1px;
    }

    .search-bar-form {
      width: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .search-input-wrapper {
      width: 100%;
      display: flex;
      align-items: center;
      border: 2.5px solid var(--border-color);
      border-radius: 30px;
      padding: 0 8px 0 16px;
      height: clamp(44px, 7vw, 56px);
      box-sizing: border-box;
      background-color: var(--bg-color);
    }

    .search-icon {
      width: 18px; height: 18px;
      margin-right: 10px;
      fill: none;
      stroke: var(--text-color);
      stroke-width: 2.5;
      stroke-linecap: round;
      stroke-linejoin: round;
      flex-shrink: 0;
    }

    .search-input {
      flex: 1;
      border: none;
      outline: none;
      background: transparent;
      font-family: inherit;
      font-size: clamp(14px, 2vw, 16px);
      color: var(--text-color);
      min-width: 0;
    }

    .go-btn {
      background-color: #1a73e8;
      color: white;
      border: none;
      padding: 8px 16px;
      border-radius: 20px;
      font-family: inherit;
      font-size: clamp(13px, 1.8vw, 15px);
      font-weight: 600;
      cursor: pointer;
      flex-shrink: 0;
      margin-left: 6px;
    }

    .go-btn:hover { background-color: #1557b0; }

    /* Category Suggestion Pills */
    .suggestions-pills {
      display: flex;
      gap: 8px;
      margin-top: 15px;
      overflow-x: auto;
      width: 100%;
      padding-bottom: 5px;
      box-sizing: border-box;
      justify-content: center;
      flex-wrap: wrap;
    }

    .suggestion-chip {
      background-color: var(--card-bg);
      border: 2px solid var(--border-color);
      color: var(--text-color);
      padding: 6px 14px;
      border-radius: 20px;
      font-family: inherit;
      font-size: clamp(11px, 1.5vw, 13px);
      font-weight: 600;
      cursor: pointer;
      white-space: nowrap;
      transition: background-color 0.2s, color 0.2s;
    }

    .suggestion-chip:hover {
      background-color: #1a73e8;
      color: white;
      border-color: #1a73e8;
    }

    /* Section Divider Line */
    .search-divider {
      width: 100%;
      height: 1px;
      background-color: var(--divider-color);
      margin-top: 18px;
      display: none;
    }

    .search-divider.active {
      display: block;
    }

    /* Filter Bar Section */
    .filter-bar {
      width: 100%;
      display: none;
      gap: 8px;
      margin-top: 15px;
      overflow-x: auto;
      padding-bottom: 5px;
      box-sizing: border-box;
    }

    .filter-bar.active { display: flex; }

    .filter-chip {
      background-color: var(--card-bg);
      border: 2px solid var(--border-color);
      color: var(--text-color);
      padding: 6px 14px;
      border-radius: 20px;
      font-family: inherit;
      font-size: clamp(11px, 1.5vw, 13px);
      font-weight: 600;
      cursor: pointer;
      white-space: nowrap;
      transition: background-color 0.2s, color 0.2s;
    }

    .filter-chip.active, .filter-chip:hover {
      background-color: #1a73e8;
      color: white;
      border-color: #1a73e8;
    }

    /* Results Content Section */
    .content-section {
      width: 100%;
      margin-top: 25px;
    }

    .carousel-container {
      display: flex;
      gap: 16px;
      overflow-x: auto;
      padding-bottom: 15px;
      width: 100%;
      box-sizing: border-box;
      scroll-snap-type: x mandatory;
    }

    .carousel-container::-webkit-scrollbar { height: 5px; }
    .carousel-container::-webkit-scrollbar-thumb { background: rgba(128,128,128,0.4); border-radius: 10px; }

    .carousel-card {
      min-width: 240px;
      max-width: 280px;
      flex: 0 0 75%;
      height: 230px;
      background-color: var(--card-bg);
      border: 2px solid var(--border-color);
      border-radius: 16px;
      scroll-snap-align: start;
      cursor: pointer;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      box-sizing: border-box;
      transition: transform 0.2s;
    }

    @media (min-width: 768px) {
      .carousel-card {
        flex: 0 0 calc(33.333% - 11px);
        min-width: unset;
        max-width: unset;
      }
    }

    .carousel-card:hover { transform: translateY(-3px); }

    .card-img-container {
      width: 100%;
      height: 115px;
      background: #ddd;
      overflow: hidden;
    }

    .card-img-container img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .card-content {
      padding: 10px 12px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      flex: 1;
    }

    .carousel-card h3 { margin: 0 0 4px 0; font-size: 14px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .carousel-card p { margin: 0; font-size: 11px; opacity: 0.8; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }

    /* Comparison Section & Table */
    .comparison-section {
      margin-top: 25px;
      background: var(--card-bg);
      border: 2px solid var(--border-color);
      border-radius: 16px;
      padding: 16px;
      display: none;
      width: 100%;
      box-sizing: border-box;
    }

    .comparison-section.active { display: block; }

    .comparison-section h3 {
      font-size: clamp(16px, 2.5vw, 20px);
      margin-top: 0;
      margin-bottom: 12px;
    }

    .table-responsive {
      width: 100%;
      overflow-x: auto;
    }

    .comparison-table {
      width: 100%;
      border-collapse: collapse;
      text-align: left;
      min-width: 480px;
    }

    .comparison-table th, .comparison-table td {
      padding: 10px 8px;
      border-bottom: 1px solid rgba(128, 128, 128, 0.2);
      font-size: clamp(12px, 1.6vw, 14px);
    }

    .book-btn {
      background-color: #1a73e8;
      color: white;
      border: none;
      padding: 5px 10px;
      border-radius: 14px;
      cursor: pointer;
      font-weight: 600;
      font-size: clamp(11px, 1.5vw, 13px);
      text-decoration: none;
      display: inline-block;
      white-space: nowrap;
    }

    .book-btn:hover { background-color: #1557b0; }
  </style>
</head>
<body class="dark-mode">

  <div class="top-bar-controls">
    <button class="subscribe-btn" onclick="alert('Thank you for subscribing!')">Subscribe</button>
    <div class="theme-switch-wrapper">
      <label class="switch">
        <input type="checkbox" id="themeCheckbox" checked onchange="toggleTheme()">
        <span class="slider"></span>
      </label>
    </div>
  </div>

  <div class="main-wrapper">
    <div class="search-container">
      <div class="logo">CurateSearch</div>
      
      <form class="search-bar-form" id="searchForm" onsubmit="performSearch(event)">
        <div class="search-input-wrapper">
          <svg class="search-icon" viewBox="0 0 24 24">
            <circle cx="11" cy="11" r="8"></circle>
            <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
          </svg>
          <input type="text" id="searchInput" class="search-input" autofocus autocomplete="off" placeholder="Search products, services, items...">
          <button type="submit" class="go-btn">Go</button>
        </div>
      </form>

      <!-- Category Suggestion Pills -->
      <div class="suggestions-pills" id="suggestionsPills">
        <button class="suggestion-chip" onclick="searchPreset('Electronics')">Electronics</button>
        <button class="suggestion-chip" onclick="searchPreset('Local Services')">Local Services</button>
        <button class="suggestion-chip" onclick="searchPreset('Hotels & Stays')">Hotels & Stays</button>
        <button class="suggestion-chip" onclick="searchPreset('SaaS Tools')">SaaS Tools</button>
        <button class="suggestion-chip" onclick="searchPreset('Real Estate')">Real Estate</button>
      </div>

      <!-- Divider Line -->
      <div class="search-divider" id="searchDivider"></div>

      <!-- Filter Bar -->
      <div class="filter-bar" id="filterBar">
        <button class="filter-chip active" onclick="applyFilter('all', this)">All Offerings</button>
        <button class="filter-chip" onclick="applyFilter('location', this)">Location / Hub</button>
        <button class="filter-chip" onclick="applyFilter('price', this)">Price / Rate</button>
        <button class="filter-chip" onclick="applyFilter('category', this)">Category</button>
      </div>
    </div>

    <div class="content-section">
      <div class="carousel-container" id="carouselContainer">
        <!-- Dynamic Carousel Cards Will Load Here -->
      </div>

      <div class="comparison-section" id="comparisonSection">
        <h3 id="comparisonTitle">Commercial Matrix</h3>
        <div class="table-responsive">
          <table class="comparison-table">
            <thead>
              <tr id="tableHeaderRow">
                <!-- Dynamically updated headers -->
              </tr>
            </thead>
            <tbody id="comparisonTableBody">
              <!-- Dynamic Comparison Rows Will Load Here -->
            </tbody>
          </table>
        </div>
      </div>
    </div>
  </div>

  <script>
    let globalResults = [];
    let currentQuery = '';

    function toggleTheme() {
      document.body.classList.toggle('dark-mode');
    }

    function searchPreset(term) {
      document.getElementById('searchInput').value = term;
      document.getElementById('searchForm').dispatchEvent(new Event('submit'));
    }

    async function performSearch(event) {
      event.preventDefault();
      currentQuery = document.getElementById('searchInput').value.trim();
      if (!currentQuery) return;

      const carousel = document.getElementById('carouselContainer');
      const filterBar = document.getElementById('filterBar');
      const divider = document.getElementById('searchDivider');
      
      carousel.innerHTML = '<p style="padding:20px;">Scanning commercial database...</p>';
      filterBar.classList.remove('active');
      divider.classList.remove('active');

      try {
        const response = await fetch(`https://api.duckduckgo.com/?q=${encodeURIComponent(currentQuery)}&format=json&no_html=1`);
        if (!response.ok) throw new Error('Network response failed');
        const data = await response.json();
        
        const results = [];
        
        if (data.Heading && data.AbstractText) {
          results.push({
            title: data.Heading,
            content: data.AbstractText,
            image: data.Image ? `https://duckduckgo.com${data.Image}` : null
          });
        }

        if (data.RelatedTopics && data.RelatedTopics.length > 0) {
          data.RelatedTopics.forEach(topic => {
            if (topic.Text && topic.FirstURL) {
              results.push({
                title: topic.Text.split(' - ')[0] || topic.Text,
                content: topic.Text,
                image: topic.Icon && topic.Icon.URL ? `https://duckduckgo.com${topic.Icon.URL}` : null
              });
            }
          });
        }

        if (results.length > 0) {
          await enrichImagesWithWikipedia(results);
          globalResults = results;
          renderCarousel(globalResults, currentQuery);
          filterBar.classList.add('active');
          divider.classList.add('active');
        } else {
          await renderFallbackCarousel(currentQuery);
          filterBar.classList.add('active');
          divider.classList.add('active');
        }
      } catch (error) {
        await renderFallbackCarousel(currentQuery);
        filterBar.classList.add('active');
        divider.classList.add('active');
      }
    }

    async function enrichImagesWithWikipedia(results) {
      for (let item of results) {
        try {
          const searchTerm = item.title.split(' - ')[0].trim();
          const wikiRes = await fetch(`https://en.wikipedia.org/w/api.php?action=query&titles=${encodeURIComponent(searchTerm)}&prop=pageimages&pithumbsize=500&format=json&origin=*`);
          const wikiData = await wikiRes.json();
          const pages = wikiData.query.pages;
          for (let pageId in pages) {
            if (pages[pageId].thumbnail && pages[pageId].thumbnail.source) {
              item.image = pages[pageId].thumbnail.source;
              break;
            }
          }
        } catch (e) {}
      }
    }

    function getCardImage(item, query) {
      if (item.image && item.image.length > 10) {
        return item.image;
      }
      const targetTerm = encodeURIComponent(item.title || query);
      return `https://images.unsplash.com/photo-1526304640581-d334cdbbf45e?auto=format&fit=crop&w=500&q=80&sig=${targetTerm}`;
    }

    function renderCarousel(results, query) {
      const carousel = document.getElementById('carouselContainer');
      carousel.innerHTML = '';

      results.slice(0, 6).forEach((item) => {
        const card = document.createElement('div');
        card.className = 'carousel-card';
        const imgSrc = getCardImage(item, query);
        
        card.innerHTML = `
          <div class="card-img-container">
            <img src="${imgSrc}" alt="${item.title}" onerror="this.src='https://images.unsplash.com/photo-1460925895917-afdab827c52f?auto=format&fit=crop&w=500&q=80'">
          </div>
          <div class="card-content">
            <h3>${item.title}</h3>
            <p>${item.content}</p>
          </div>
        `;
        card.onclick = () => showComparison(item, query);
        carousel.appendChild(card);
      });
    }

    async function renderFallbackCarousel(query) {
      const mockItems = [
        { title: query + " - Premium Offering", content: "Top-tier commercial grade specification available for immediate deployment." },
        { title: query + " - Standard Vendor Package", content: "Cost-effective baseline configuration for standard operational use." },
        { title: query + " - Bulk Enterprise Solution", content: "High-volume supply arrangement with dedicated support contracts." }
      ];

      await enrichImagesWithWikipedia(mockItems);
      globalResults = mockItems;
      renderCarousel(globalResults, query);
    }

    function applyFilter(filterType, element) {
      document.querySelectorAll('.filter-chip').forEach(btn => btn.classList.remove('active'));
      element.classList.add('active');

      let filtered = [...globalResults];
      if (filterType === 'location') {
        filtered = globalResults.filter(item => /mombasa|kenya|nairobi|hub|branch|location/i.test(item.title + " " + item.content));
        if (filtered.length === 0) filtered = globalResults;
      } else if (filterType === 'price') {
        filtered = globalResults.filter(item => /price|rate|ksh|\$|cost|fee|valuation/i.test(item.title + " " + item.content));
        if (filtered.length === 0) filtered = globalResults;
      } else if (filterType === 'category') {
        filtered = globalResults.reverse();
      }
      renderCarousel(filtered, currentQuery);
    }

    const industrySchemas = {
      retail: {
        headers: ['Product / Item', 'Est. Price', 'Supplier / Stock', 'Action'],
        actionText: 'Buy Now',
        rows: [
          { col1: 'Premium Retail Unit', col2: 'Ksh 2,450', col3: 'In Stock / Local Hub' },
          { col1: 'Standard Commercial Grade', col2: 'Ksh 1,200', col3: 'Ready to Ship' },
          { col1: 'Bulk Package Deal', col2: 'Ksh 9,800', col3: 'Direct Distributor' }
        ]
      },
      localservice: {
        headers: ['Service Type', 'Hourly / Flat Rate', 'Provider / Contractor', 'Action'],
        actionText: 'Book Service',
        rows: [
          { col1: 'On-Site Technician Call', col2: 'Ksh 1,500 / hr', col3: 'Verified Professional' },
          { col1: 'Maintenance Package', col2: 'Ksh 5,000 / visit', col3: 'Licensed Team' },
          { col1: 'Emergency Response', col2: 'Ksh 3,500 flat', col3: '24/7 Availability' }
        ]
      },
      hospitality: {
        headers: ['Listing / Accommodation', 'Nightly Rate', 'Location & Perks', 'Action'],
        actionText: 'Reserve',
        rows: [
          { col1: 'Executive Suite', col2: '$180 / night', col3: 'Ocean View / Full Board' },
          { col1: 'Standard Room', col2: '$85 / night', col3: 'City Center / Wi-Fi' },
          { col1: 'Extended Stay Villa', col2: '$350 / night', col3: 'Private Access / Pool' }
        ]
      },
      b2b: {
        headers: ['Professional Service', 'Retainer / Fee', 'Firm / Agency', 'Action'],
        actionText: 'Consult',
        rows: [
          { col1: 'Legal Compliance Audit', col2: '$1,200', col3: 'Senior Partner' },
          { col1: 'Tax & Accounting Setup', col2: '$450 / mo', col3: 'CPA Certified' },
          { col1: 'Corporate Advisory', col2: '$2,500 project', col3: 'Syndicate Lead' }
        ]
      },
      digitalservice: {
        headers: ['Platform / Tool', 'Monthly Fee', 'Core Features', 'Action'],
        actionText: 'Subscribe',
        rows: [
          { col1: 'Cloud Infrastructure Node', col2: '$40 / mo', col3: '99.9% Uptime / NVMe' },
          { col1: 'SaaS Business Suite', col2: '$99 / mo', col3: 'Unlimited Users' },
          { col1: 'Managed Hosting Environment', col2: '$25 / mo', col3: 'Automated Backups' }
        ]
      },
      transport: {
        headers: ['Vehicle / Route', 'Rental / Fare', 'Dealership / App', 'Action'],
        actionText: 'Rent / Buy',
        rows: [
          { col1: 'SUV Fleet Vehicle', col2: '$90 / day', col3: 'Unlimited Mileage' },
          { col1: 'Electric City Sedan', col2: '$45,000 MSRP', col3: 'AWD / Long Range' },
          { col1: 'Logistics Freight Run', col2: 'Ksh 12,000', col3: 'Insured Cargo' }
        ]
      },
      realestate: {
        headers: ['Property Asset', 'Valuation / Rent', 'Agent / Mandate', 'Action'],
        actionText: 'Inquire',
        rows: [
          { col1: 'Commercial Office Block', col2: '$850,000', col3: '8.5% Net Yield' },
          { col1: 'Residential Apartment', col2: '$1,200 / mo', col3: 'Gated Community' },
          { col1: 'Mixed-Use Development Plot', col2: '$220,000', col3: 'Clean Title Deed' }
        ]
      },
      digitalproducts: {
        headers: ['Digital Asset / Item', 'License Price', 'Creator / Source', 'Action'],
        actionText: 'Download',
        rows: [
          { col1: 'Enterprise Software License', col2: '$299', col3: 'Lifetime Updates' },
          { col1: 'Financial Modeling Kit', col2: '$49', col3: 'Spreadsheet Template' },
          { col1: 'UI Design System Bundle', col2: '$79', col3: 'Multi-User Access' }
        ]
      },
      default: {
        headers: ['Commercial Offering', 'Price / Terms', 'Supplier / Source', 'Action'],
        actionText: 'View Deal',
        rows: [
          { col1: 'Primary Package Option', col2: '$499.00', col3: 'In Stock / Verified' },
          { col1: 'Alternative Solution', col2: '$450.00', col3: 'Standard Dispatch' },
          { col1: 'Enterprise Bundle', col2: '$899.00', col3: 'Direct Contract' }
        ]
      }
    };

    function detectIndustry(text) {
      if (/naivas|carrefour|supermarket|grocery|store|shop|mall|retail|shirt|shoes|phone|laptop|hardware|apparel|electronics/i.test(text)) return 'retail';
      if (/salon|plumb|clean|repair|mechanic|electric|contractor|security|pest|laundry|barber|local services/i.test(text)) return 'localservice';
      if (/hotel|resort|stay|bnb|flight|airline|travel|tour|accommodation|vacation|hotels/i.test(text)) return 'hospitality';
      if (/legal|lawyer|account|tax|consult|marketing|audit|agency|advisory|b2b/i.test(text)) return 'b2b';
      if (/hosting|saas|cloud|domain|storage|software|subscription|api|server/i.test(text)) return 'digitalservice';
      if (/car|vehicle|suv|sedan|transport|fleet|rental|uber|flight|delivery|freight/i.test(text)) return 'transport';
      if (/property|house|apartment|real estate|land|villa|plot|commercial block|lease/i.test(text)) return 'realestate';
      if (/ebook|license|download|template|course|asset|pdf|kit|code/i.test(text)) return 'digitalproducts';
      return 'default';
    }

    function showComparison(item, query) {
      const section = document.getElementById('comparisonSection');
      const title = document.getElementById('comparisonTitle');
      const headerRow = document.getElementById('tableHeaderRow');
      const tbody = document.getElementById('comparisonTableBody');

      title.innerText = `Commercial Matrix: ${item.title}`;
      section.classList.add('active');

      const combinedText = (item.title + " " + item.content + " " + query).toLowerCase();
      const industryKey = detectIndustry(combinedText);
      const schema = industrySchemas[industryKey];

      headerRow.innerHTML = schema.headers.map(h => `<th style="width: 25%;">${h}</th>`).join('');

      tbody.innerHTML = schema.rows.map(row => `
        <tr>
          <td><strong>${row.col1}</strong></td>
          <td>${row.col2}</td>
          <td>${row.col3}</td>
          <td><a href="https://example.com" target="_blank" class="book-btn">${schema.actionText}</a></td>
        </tr>
      `).join('');

      section.scrollIntoView({ behavior: 'smooth' });
    }
  </script>
</body>
