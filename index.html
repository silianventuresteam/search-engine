<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Search & Compare</title>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-color: #ffffff;
      --text-color: #202124;
      --border-color: #000000;
      --card-bg: #f8f9fa;
    }

    body.dark-mode {
      --bg-color: #202124;
      --text-color: #e8eaed;
      --border-color: #ffffff;
      --card-bg: #303134;
    }

    body {
      font-family: 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif;
      background-color: var(--bg-color);
      color: var(--text-color);
      margin: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
      overflow-y: auto;
      transition: background-color 0.3s ease, color 0.3s ease;
    }

    .theme-switch-container {
      position: absolute;
      top: 20px;
      right: 20px;
      display: flex;
      align-items: center;
      z-index: 100;
    }

    .switch {
      position: relative;
      display: inline-block;
      width: 44px;
      height: 24px;
    }

    .switch input { opacity: 0; width: 0; height: 0; }

    .slider {
      position: absolute;
      cursor: pointer;
      top: 0; left: 0; right: 0; bottom: 0;
      background-color: #ccc;
      transition: 0.3s;
      border-radius: 24px;
    }

    .slider:before {
      position: absolute;
      content: "";
      height: 18px; width: 18px;
      left: 3px; bottom: 3px;
      background-color: white;
      transition: 0.3s;
      border-radius: 50%;
    }

    input:checked + .slider { background-color: #1a73e8; }
    input:checked + .slider:before { transform: translateX(20px); }

    .main-wrapper {
      display: flex;
      flex-direction: column;
      align-items: center;
      width: 100%;
      padding: 40px 20px;
      box-sizing: border-box;
    }

    .search-container {
      width: 100%;
      max-width: 584px;
      display: flex;
      flex-direction: column;
      align-items: center;
      position: sticky;
      top: 0;
      background-color: var(--bg-color);
      padding: 20px 0;
      z-index: 50;
    }

    .logo {
      font-size: 48px;
      font-weight: 600;
      margin-bottom: 20px;
      letter-spacing: -1px;
    }

    .search-bar-form {
      width: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .search-input-wrapper {
      width: 100%;
      display: flex;
      align-items: center;
      border: 3px solid var(--border-color);
      border-radius: 28px;
      padding: 0 18px;
      height: 48px;
      box-sizing: border-box;
      background-color: var(--bg-color);
    }

    .search-icon {
      width: 20px; height: 20px;
      margin-right: 12px;
      fill: none;
      stroke: var(--text-color);
      stroke-width: 2.5;
      stroke-linecap: round;
      stroke-linejoin: round;
      flex-shrink: 0;
    }

    .search-input {
      flex: 1;
      border: none;
      outline: none;
      background: transparent;
      font-family: inherit;
      font-size: 16px;
      color: var(--text-color);
    }

    .category-menu {
      display: flex;
      gap: 10px;
      justify-content: center;
      margin-top: 16px;
      flex-wrap: wrap;
    }

    .pill-btn {
      background-color: transparent;
      border: 1px solid rgba(128, 128, 128, 0.3);
      color: var(--text-color);
      padding: 8px 16px;
      border-radius: 50px;
      font-family: inherit;
      font-size: 14px;
      font-weight: 500;
      cursor: pointer;
    }

    .pill-btn:hover { background-color: rgba(128, 128, 128, 0.1); }

    /* Carousel and Results Section */
    .content-section {
      width: 100%;
      max-width: 900px;
      margin-top: 40px;
    }

    .carousel-container {
      display: flex;
      gap: 20px;
      overflow-x: auto;
      padding-bottom: 20px;
      scroll-snap-type: x mandatory;
    }

    .carousel-card {
      min-width: 280px;
      height: 180px;
      background-color: var(--card-bg);
      border: 2px solid var(--border-color);
      border-radius: 16px;
      flex-shrink: 0;
      scroll-snap-align: start;
      cursor: pointer;
      display: flex;
      flex-direction: column;
      justify-content: flex-end;
      padding: 16px;
      box-sizing: border-box;
      transition: transform 0.2s;
    }

    .carousel-card:hover { transform: translateY(-4px); }

    .carousel-card h3 { margin: 0 0 8px 0; font-size: 18px; }
    .carousel-card p { margin: 0; font-size: 14px; opacity: 0.8; }

    /* 3-Level Comparison Overlay / Table */
    .comparison-section {
      margin-top: 30px;
      background: var(--card-bg);
      border: 2px solid var(--border-color);
      border-radius: 16px;
      padding: 20px;
      display: none;
    }

    .comparison-section.active { display: block; }

    .comparison-table {
      width: 100%;
      border-collapse: collapse;
      text-align: left;
    }

    .comparison-table th, .comparison-table td {
      padding: 12px;
      border-bottom: 1px solid rgba(128, 128, 128, 0.2);
    }

    .book-btn {
      background-color: #1a73e8;
      color: white;
      border: none;
      padding: 8px 16px;
      border-radius: 20px;
      cursor: pointer;
      font-weight: 600;
      text-decoration: none;
      display: inline-block;
    }

    .book-btn:hover { background-color: #1557b0; }
  </style>
</head>
<body class="dark-mode">

  <div class="theme-switch-container">
    <label class="switch">
      <input type="checkbox" id="themeCheckbox" checked onchange="toggleTheme()">
      <span class="slider"></span>
    </label>
  </div>

  <div class="main-wrapper">
    <div class="search-container">
      <div class="logo">Search</div>
      <form class="search-bar-form" id="searchForm" onsubmit="performSearch(event)">
        <div class="search-input-wrapper">
          <svg class="search-icon" viewBox="0 0 24 24">
            <circle cx="11" cy="11" r="8"></circle>
            <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
          </svg>
          <input type="text" id="searchInput" class="search-input" autofocus autocomplete="off" placeholder="Search the web...">
        </div>
        <div class="category-menu">
          <button type="button" class="pill-btn" onclick="setQueryAndSearch('Flights to Mombasa')">Flights</button>
          <button type="button" class="pill-btn" onclick="setQueryAndSearch('Hotels in Mombasa')">Hotels & Resorts</button>
          <button type="button" class="pill-btn" onclick="setQueryAndSearch('Restaurants in Mombasa')">Restaurants</button>
        </div>
      </form>
    </div>

    <div class="content-section">
      <div class="carousel-container" id="carouselContainer">
        <!-- Dynamic Carousel Cards Will Load Here -->
      </div>

      <div class="comparison-section" id="comparisonSection">
        <h3 id="comparisonTitle" style="margin-top:0;">Option Comparison</h3>
        <table class="comparison-table">
          <thead>
            <tr>
              <th>Provider / Airline</th>
              <th>Price</th>
              <th>Duration / Detail</th>
              <th>Direct Booking</th>
            </tr>
          </thead>
          <tbody id="comparisonTableBody">
            <!-- Dynamic Comparison Rows Will Load Here -->
          </tbody>
        </table>
      </div>
    </div>
  </div>

  <script>
    function toggleTheme() {
      document.body.classList.toggle('dark-mode');
    }

    function setQueryAndSearch(query) {
      document.getElementById('searchInput').value = query;
      document.getElementById('searchForm').dispatchEvent(new Event('submit'));
    }

    async function performSearch(event) {
      event.preventDefault();
      const query = document.getElementById('searchInput').value.trim();
      if (!query) return;

      const carousel = document.getElementById('carouselContainer');
      carousel.innerHTML = '<p style="padding:20px;">Fetching live search results...</p>';

      try {
        const response = await fetch(`https://searx.be/search?q=${encodeURIComponent(query)}&format=json`);
        if (!response.ok) throw new Error('Network response was not ok');
        const data = await response.json();
        renderCarousel(data.results || []);
      } catch (error) {
        renderFallbackCarousel(query);
      }
    }

    function renderCarousel(results) {
      const carousel = document.getElementById('carouselContainer');
      carousel.innerHTML = '';

      if (!results || results.length === 0) {
        renderFallbackCarousel("results");
        return;
      }

      results.slice(0, 6).forEach((item, index) => {
        const card = document.createElement('div');
        card.className = 'carousel-card';
        card.innerHTML = `
          <h3>${item.title || 'Option ' + (index + 1)}</h3>
          <p>${item.content ? item.content.substring(0, 80) + '...' : 'Click to compare rates'}</p>
        `;
        card.onclick = () => showComparison(item);
        carousel.appendChild(card);
      });
    }

    function renderFallbackCarousel(query) {
      const carousel = document.getElementById('carouselContainer');
      carousel.innerHTML = '';
      
      const mockItems = [
        { title: "Kenya Airways Options", content: "Direct flights and premium connection schedules.", url: "#" },
        { title: "Jambojet Specials", content: "Affordable regional flights with flexible timing.", url: "#" },
        { title: "Fly540 Routes", content: "Reliable alternative carrier services.", url: "#" }
      ];

      mockItems.forEach((item) => {
        const card = document.createElement('div');
        card.className = 'carousel-card';
        card.innerHTML = `
          <h3>${item.title}</h3>
          <p>${item.content}</p>
        `;
        card.onclick = () => showComparison(item);
        carousel.appendChild(card);
      });
    }

    function showComparison(item) {
      const section = document.getElementById('comparisonSection');
      const title = document.getElementById('comparisonTitle');
      const tbody = document.getElementById('comparisonTableBody');

      title.innerText = `Comparing: ${item.title}`;
      section.classList.add('active');

      tbody.innerHTML = `
        <tr>
          <td><strong>Kenya Airways</strong></td>
          <td>$150</td>
          <td>4h 30m (Direct)</td>
          <td><a href="https://example.com/book?airline=kq" target="_blank" class="book-btn">Book Now</a></td>
        </tr>
        <tr>
          <td><strong>Jambojet</strong></td>
          <td>$120</td>
          <td>5h 00m (1 Stop)</td>
          <td><a href="https://example.com/book?airline=jambo" target="_blank" class="book-btn">Book Now</a></td>
        </tr>
        <tr>
          <td><strong>Fly540</strong></td>
          <td>$135</td>
          <td>4h 45m (Direct)</td>
          <td><a href="https://example.com/book?airline=fly540" target="_blank" class="book-btn">Book Now</a></td>
        </tr>
      `;
      section.scrollIntoView({ behavior: 'smooth' });
    }
  </script>
</body>
</html>
