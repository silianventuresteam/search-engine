<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Search & Compare</title>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-color: #ffffff;
      --text-color: #202124;
      --border-color: #000000;
      --card-bg: #f8f9fa;
    }

    body.dark-mode {
      --bg-color: #202124;
      --text-color: #e8eaed;
      --border-color: #ffffff;
      --card-bg: #303134;
    }

    body {
      font-family: 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif;
      background-color: var(--bg-color);
      color: var(--text-color);
      margin: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
      overflow-y: auto;
      transition: background-color 0.3s ease, color 0.3s ease;
    }

    .theme-switch-container {
      position: absolute;
      top: 20px;
      right: 20px;
      display: flex;
      align-items: center;
      z-index: 100;
    }

    .switch {
      position: relative;
      display: inline-block;
      width: 44px;
      height: 24px;
    }

    .switch input { opacity: 0; width: 0; height: 0; }

    .slider {
      position: absolute;
      cursor: pointer;
      top: 0; left: 0; right: 0; bottom: 0;
      background-color: #ccc;
      transition: 0.3s;
      border-radius: 24px;
    }

    .slider:before {
      position: absolute;
      content: "";
      height: 18px; width: 18px;
      left: 3px; bottom: 3px;
      background-color: white;
      transition: 0.3s;
      border-radius: 50%;
    }

    input:checked + .slider { background-color: #1a73e8; }
    input:checked + .slider:before { transform: translateX(20px); }

    .main-wrapper {
      display: flex;
      flex-direction: column;
      align-items: center;
      width: 100%;
      max-width: 900px;
      padding: 40px 20px;
      box-sizing: border-box;
    }

    .search-container {
      width: 100%;
      max-width: 584px;
      display: flex;
      flex-direction: column;
      align-items: center;
      position: sticky;
      top: 0;
      background-color: var(--bg-color);
      padding: 20px 0;
      z-index: 50;
    }

    .logo {
      font-size: 48px;
      font-weight: 600;
      margin-bottom: 20px;
      letter-spacing: -1px;
    }

    .search-bar-form {
      width: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .search-input-wrapper {
      width: 100%;
      display: flex;
      align-items: center;
      border: 3px solid var(--border-color);
      border-radius: 28px;
      padding: 0 18px;
      height: 48px;
      box-sizing: border-box;
      background-color: var(--bg-color);
    }

    .search-icon {
      width: 20px; height: 20px;
      margin-right: 12px;
      fill: none;
      stroke: var(--text-color);
      stroke-width: 2.5;
      stroke-linecap: round;
      stroke-linejoin: round;
      flex-shrink: 0;
    }

    .search-input {
      flex: 1;
      border: none;
      outline: none;
      background: transparent;
      font-family: inherit;
      font-size: 16px;
      color: var(--text-color);
    }

    .category-menu {
      display: flex;
      gap: 10px;
      justify-content: center;
      margin-top: 16px;
      flex-wrap: wrap;
    }

    .pill-btn {
      background-color: transparent;
      border: 1px solid rgba(128, 128, 128, 0.3);
      color: var(--text-color);
      padding: 8px 16px;
      border-radius: 50px;
      font-family: inherit;
      font-size: 14px;
      font-weight: 500;
      cursor: pointer;
    }

    .pill-btn:hover { background-color: rgba(128, 128, 128, 0.1); }

    /* Carousel and Results Section */
    .content-section {
      width: 100%;
      margin-top: 40px;
    }

    .carousel-container {
      display: flex;
      gap: 16px;
      overflow-x: auto;
      padding-bottom: 15px;
      width: 100%;
      box-sizing: border-box;
      scroll-snap-type: x mandatory;
    }

    .carousel-container::-webkit-scrollbar {
      height: 6px;
    }
    .carousel-container::-webkit-scrollbar-thumb {
      background: rgba(128,128,128,0.4);
      border-radius: 10px;
    }

    .carousel-card {
      min-width: 260px;
      max-width: 260px;
      height: 240px;
      background-color: var(--card-bg);
      border: 2px solid var(--border-color);
      border-radius: 16px;
      flex-shrink: 0;
      scroll-snap-align: start;
      cursor: pointer;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      box-sizing: border-box;
      transition: transform 0.2s;
    }

    .carousel-card:hover { transform: translateY(-4px); }

    .card-img-container {
      width: 100%;
      height: 120px;
      background: #ddd;
      overflow: hidden;
    }

    .card-img-container img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .card-content {
      padding: 12px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      flex: 1;
    }

    .carousel-card h3 { margin: 0 0 4px 0; font-size: 15px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .carousel-card p { margin: 0; font-size: 12px; opacity: 0.8; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }

    /* 3-Level Comparison Overlay / Table */
    .comparison-section {
      margin-top: 30px;
      background: var(--card-bg);
      border: 2px solid var(--border-color);
      border-radius: 16px;
      padding: 20px;
      display: none;
      width: 100%;
      box-sizing: border-box;
    }

    .comparison-section.active { display: block; }

    .comparison-table {
      width: 100%;
      border-collapse: collapse;
      text-align: left;
      table-layout: fixed;
    }

    .comparison-table th, .comparison-table td {
      padding: 10px 8px;
      border-bottom: 1px solid rgba(128, 128, 128, 0.2);
      font-size: 13px;
      word-wrap: break-word;
    }

    .book-btn {
      background-color: #1a73e8;
      color: white;
      border: none;
      padding: 6px 12px;
      border-radius: 16px;
      cursor: pointer;
      font-weight: 600;
      font-size: 12px;
      text-decoration: none;
      display: inline-block;
      white-space: nowrap;
    }

    .book-btn:hover { background-color: #1557b0; }
  </style>
</head>
<body class="dark-mode">

  <div class="theme-switch-container">
    <label class="switch">
      <input type="checkbox" id="themeCheckbox" checked onchange="toggleTheme()">
      <span class="slider"></span>
    </label>
  </div>

  <div class="main-wrapper">
    <div class="search-container">
      <div class="logo">Search</div>
      <form class="search-bar-form" id="searchForm" onsubmit="performSearch(event)">
        <div class="search-input-wrapper">
          <svg class="search-icon" viewBox="0 0 24 24">
            <circle cx="11" cy="11" r="8"></circle>
            <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
          </svg>
          <input type="text" id="searchInput" class="search-input" autofocus autocomplete="off" placeholder="Search the web...">
        </div>
        <div class="category-menu">
          <button type="button" class="pill-btn" onclick="setQueryAndSearch('Flights to Mombasa')">Flights</button>
          <button type="button" class="pill-btn" onclick="setQueryAndSearch('Hotels in Mombasa')">Hotels & Resorts</button>
          <button type="button" class="pill-btn" onclick="setQueryAndSearch('Restaurants in Mombasa')">Restaurants</button>
        </div>
      </form>
    </div>

    <div class="content-section">
      <div class="carousel-container" id="carouselContainer">
        <!-- Dynamic Carousel Cards Will Load Here -->
      </div>

      <div class="comparison-section" id="comparisonSection">
        <h3 id="comparisonTitle" style="margin-top:0;">Option Comparison</h3>
        <table class="comparison-table">
          <thead>
            <tr>
              <th style="width: 30%;">Provider</th>
              <th style="width: 25%;">Rate/Price</th>
              <th style="width: 25%;">Details</th>
              <th style="width: 20%;">Action</th>
            </tr>
          </thead>
          <tbody id="comparisonTableBody">
            <!-- Dynamic Comparison Rows Will Load Here -->
          </tbody>
        </table>
      </div>
    </div>
  </div>

  <script>
    function toggleTheme() {
      document.body.classList.toggle('dark-mode');
    }

    function setQueryAndSearch(query) {
      document.getElementById('searchInput').value = query;
      document.getElementById('searchForm').dispatchEvent(new Event('submit'));
    }

    async function performSearch(event) {
      event.preventDefault();
      const query = document.getElementById('searchInput').value.trim();
      if (!query) return;

      const carousel = document.getElementById('carouselContainer');
      carousel.innerHTML = '<p style="padding:20px;">Fetching live search results...</p>';

      try {
        const response = await fetch(`https://searx.be/search?q=${encodeURIComponent(query)}&format=json`);
        if (!response.ok) throw new Error('Network response was not ok');
        const data = await response.json();
        renderCarousel(data.results || [], query);
      } catch (error) {
        renderFallbackCarousel(query);
      }
    }

    function renderCarousel(results, query) {
      const carousel = document.getElementById('carouselContainer');
      carousel.innerHTML = '';

      if (!results || results.length === 0) {
        renderFallbackCarousel(query);
        return;
      }

      results.slice(0, 6).forEach((item, index) => {
        const card = document.createElement('div');
        card.className = 'carousel-card';
        const imgSrc = `https://picsum.photos/seed/${encodeURIComponent(item.title || index)}/300/200`;
        
        card.innerHTML = `
          <div class="card-img-container">
            <img src="${imgSrc}" alt="Thumbnail">
          </div>
          <div class="card-content">
            <h3>${item.title || 'Option ' + (index + 1)}</h3>
            <p>${item.content ? item.content : 'Click to compare rates'}</p>
          </div>
        `;
        card.onclick = () => showComparison(item, query);
        carousel.appendChild(card);
      });
    }

    function renderFallbackCarousel(query) {
      const carousel = document.getElementById('carouselContainer');
      carousel.innerHTML = '';
      
      let mockItems = [];
      const lowerQ = query.toLowerCase();

      if (lowerQ.includes('hotel') || lowerQ.includes('resort')) {
        mockItems = [
          { title: "PrideInn Paradise Beach Resort", content: "Luxury beachfront resort with water slides.", url: "#" },
          { title: "Sarova Whitesands Beach Resort", content: "Renowned 5-star resort along Diani/Mombasa coast.", url: "#" },
          { title: "Voyager Beach Resort", content: "Vibrant ship-themed resort with family activities.", url: "#" }
        ];
      } else if (lowerQ.includes('restaurant') || lowerQ.includes('food')) {
        mockItems = [
          { title: "Ali Barbour's Cave Restaurant", content: "Unique dining experience inside an open-air coral cave.", url: "#" },
          { title: "Tamarind Mombasa", content: "Famous floating seafood restaurant and terrace.", url: "#" },
          { title: "Forodhani Restaurant", content: "Swahili coastal dishes and vibrant ambiance.", url: "#" }
        ];
      } else {
        mockItems = [
          { title: "Kenya Airways Options", content: "Direct flights and premium connection schedules.", url: "#" },
          { title: "Jambojet Specials", content: "Affordable regional flights with flexible timing.", url: "#" },
          { title: "Fly540 Routes", content: "Reliable alternative carrier services.", url: "#" }
        ];
      }

      mockItems.forEach((item, index) => {
        const card = document.createElement('div');
        card.className = 'carousel-card';
        const imgSrc = `https://picsum.photos/seed/mock${index}/300/200`;

        card.innerHTML = `
          <div class="card-img-container">
            <img src="${imgSrc}" alt="Thumbnail">
          </div>
          <div class="card-content">
            <h3>${item.title}</h3>
            <p>${item.content}</p>
          </div>
        `;
        card.onclick = () => showComparison(item, query);
        carousel.appendChild(card);
      });
    }

    function showComparison(item, query) {
      const section = document.getElementById('comparisonSection');
      const title = document.getElementById('comparisonTitle');
      const tbody = document.getElementById('comparisonTableBody');

      title.innerText = `Comparing: ${item.title}`;
      section.classList.add('active');

      let row1Name = "Option Partner A", row2Name = "Option Partner B", row3Name = "Option Partner C";
      let price1 = "$120", price2 = "$140", price3 = "$160";
      let detail1 = "Standard Tier", detail2 = "Deluxe Tier", detail3 = "Premium Tier";
      
      const lowerQ = (query + item.title).toLowerCase();
      if (lowerQ.includes('hotel') || lowerQ.includes('resort')) {
        row1Name = "Booking.com";
        row2Name = "Expedia";
        row3Name = "Direct Rate";
        price1 = "$145/nt"; price2 = "$150/nt"; price3 = "$140/nt";
        detail1 = "Free Cancel"; detail2 = "Breakfast"; detail3 = "Best Price";
      } else if (lowerQ.includes('restaurant') || lowerQ.includes('food')) {
        row1Name = "Standard Table";
        row2Name = "Garden View";
        row3Name = "VIP Balcony";
        price1 = "Free"; price2 = "Free"; price3 = "$20 Dep";
        detail1 = "Indoor"; detail2 = "Outdoor"; detail3 = "Private";
      }

      tbody.innerHTML = `
        <tr>
          <td><strong>${row1Name}</strong></td>
          <td>${price1}</td>
          <td>${detail1}</td>
          <td><a href="${item.url !== '#' ? item.url : 'https://example.com'}" target="_blank" class="book-btn">Select</a></td>
        </tr>
        <tr>
          <td><strong>${row2Name}</strong></td>
          <td>${price2}</td>
          <td>${detail2}</td>
          <td><a href="${item.url !== '#' ? item.url : 'https://example.com'}" target="_blank" class="book-btn">Select</a></td>
        </tr>
        <tr>
          <td><strong>${row3Name}</strong></td>
          <td>${price3}</td>
          <td>${detail3}</td>
          <td><a href="${item.url !== '#' ? item.url : 'https://example.com'}" target="_blank" class="book-btn">Select</a></td>
        </tr>
      `;
      section.scrollIntoView({ behavior: 'smooth' });
    }
  </script>
</body>
</html>
